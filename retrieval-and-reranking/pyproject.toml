[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "techjam-two-stage-agent"
version = "0.1.0"
description = "Two-stage Top-50 retrieval and locked Top-10 reranking agent"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
exact = [
  "numpy==2.5.2",
  "torch==2.13.0",
  "transformers==5.16.1",
  "sentence-transformers==6.0.0",
]

[tool.setuptools.packages.find]
include = ["techjam_agent*"]
